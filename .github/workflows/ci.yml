name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 22.04 still has Python 3.8 builds; OKe itself targets 3.6+ stdlib only
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for test repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: unit tests
        working-directory: oke/bin
        run: python -m unittest discover -p "test_*.py"
